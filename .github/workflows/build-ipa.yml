name: Build iPhone IPA

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: 'SillyTavern URL'
        required: true
        default: 'http://aaa.xixisillytavern.top:8001/'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Workflow version
        run: |
          echo 'WORKFLOW_VERSION=v1.1.3-INLINE'
          echo "Commit: $GITHUB_SHA"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Apply SillyTavern URL
        env:
          START_URL: ${{ inputs.start_url }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          url = os.environ['START_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme not in ('http', 'https') or not parsed.hostname:
              raise SystemExit(f'Invalid URL: {url!r}')

          p = Path('SillyTavernNativePiP/AppConfig.swift')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'static let startURL = URL\(string: ".*?"\)!',
              f'static let startURL = URL(string: "{url}")!',
              text,
              count=1,
          )
          text = re.sub(
              r'static let allowedHost = ".*?"',
              f'static let allowedHost = "{parsed.hostname}"',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')
          print('Configured URL:', url)
          print('Allowed host:', parsed.hostname)
          PY

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" SillyTavernNativePiP/Info.plist
          echo "Build number: $GITHUB_RUN_NUMBER"

      - name: Build unsigned app
        id: xcode
        shell: bash
        run: |
          set +e
          rm -rf build output
          mkdir -p build output

          xcodebuild \
            -project SillyTavernNativePiP.xcodeproj \
            -target SillyTavernNativePiP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

          status=$?
          echo "xcode_status=$status" >> "$GITHUB_OUTPUT"
          echo "xcodebuild returned: $status"
          # Intentionally exit 0 here. The next step decides success by inspecting
          # the actual .app product. Some unsigned device builds have returned 65
          # after printing BUILD SUCCEEDED on GitHub-hosted Xcode runners.
          exit 0

      - name: Verify compiled app
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/SillyTavernNativePiP.app"
          BIN="$APP/SillyTavernNativePiP"

          echo "xcodebuild status was: ${{ steps.xcode.outputs.xcode_status }}"
          echo "Expected app: $APP"
          find "$PWD/build" -maxdepth 4 -name '*.app' -print || true

          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$BIN"

          echo '--- executable ---'
          /usr/bin/file "$BIN"
          echo '--- Info.plist ---'
          /usr/bin/plutil -p "$APP/Info.plist" | head -80
          echo 'Compiled .app is complete; continuing to package IPA.'

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/SillyTavernNativePiP.app"
          STAGE="$PWD/build/ipa-stage"
          OUT="$PWD/output"

          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload" "$OUT"
          /usr/bin/ditto "$APP" "$STAGE/Payload/SillyTavernNativePiP.app"

          (
            cd "$STAGE"
            /usr/bin/zip -qry "$OUT/SillyTavernNativePiP-unsigned.ipa" Payload
          )

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "$OUT/SillyTavernNativePiP-app.zip"

          (
            cd "$OUT"
            shasum -a 256 SillyTavernNativePiP-unsigned.ipa SillyTavernNativePiP-app.zip > SHA256SUMS.txt
          )

          echo '--- output ---'
          ls -lah "$OUT"

      - name: Verify IPA contents
        shell: bash
        run: |
          set -euo pipefail
          IPA="output/SillyTavernNativePiP-unsigned.ipa"
          test -s "$IPA"
          unzip -l "$IPA" | head -100
          unzip -Z1 "$IPA" | grep -Fx 'Payload/SillyTavernNativePiP.app/SillyTavernNativePiP'
          echo 'IPA structure verified.'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavernNativePiP-IPA-${{ github.run_number }}
          path: |
            output/SillyTavernNativePiP-unsigned.ipa
            output/SillyTavernNativePiP-app.zip
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo '## ✅ IPA build finished'
            echo
            echo '- Workflow: **v1.1.3-INLINE**'
            echo '- Xcode returned: `${{ steps.xcode.outputs.xcode_status }}` (the compiled app itself was verified independently)'
            echo '- Artifact: **SillyTavernNativePiP-IPA-${{ github.run_number }}**'
            echo '- Main file: `SillyTavernNativePiP-unsigned.ipa`'
            echo '- Site: `${{ inputs.start_url }}`'
            echo '- IPA is unsigned and must be signed by Sideloadly / SideStore / AltStore before installation.'
          } >> "$GITHUB_STEP_SUMMARY"
